# Stack NOVA do checkout.
#
# Sem porta publicada: quem expõe é o `cloudflared` da stack `telahub-tunnel`,
# que alcança este container pelo nome `checkout`.
#
# O Nginx desta imagem faz `proxy_pass http://backend:3001` em `/api/`, então
# este container PRECISA estar na mesma rede do backend do painel — é de lá que
# vêm plano, sessão de checkout e organização (ADR-001: backend único).
#
# ATENÇÃO: com as duas stacks do painel na mesma rede (a antiga e a nova), o
# nome `backend` fica ambíguo. Enquanto a antiga existir, confirme para qual
# delas este checkout está resolvendo antes de considerá-lo validado.

services:
  checkout:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telahub-checkout-prod
    restart: unless-stopped
    networks:
      - telahub_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  telahub_net:
    external: true
