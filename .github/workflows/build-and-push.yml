# Build das imagens e publicação no GHCR.
#
# Por que buildar aqui e não na VPS:
#   - as variáveis `VITE_*` são resolvidas em tempo de BUILD e ficam embutidas no
#     bundle; buildando na VPS, o que você configurar no Portainer NÃO chega ao
#     frontend, e o sintoma (link apontando para o lugar errado) não sugere a
#     causa;
#   - buildar disputa RAM com o que está no ar — um OOM no meio do build derruba
#     o que estava funcionando;
#   - imagem com tag = rollback é repontar a tag, não "reverter e rebuildar".
#
# O último passo chama o webhook da stack no Portainer, que faz o pull da imagem
# nova e recria o container. Cadastre a URL em Settings → Secrets → Actions com o
# nome PORTAINER_WEBHOOK. Sem o secret, o passo é pulado e o deploy é manual.

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: telahub-checkout

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy no Portainer
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK não configurado — pulando redeploy automático."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
