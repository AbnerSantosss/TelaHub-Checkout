server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # Proxy da API.
    #
    # O app chama sempre caminho relativo `/api/...` (ver src/lib/api.ts), para
    # o mesmo build servir em qualquer domínio. É aqui que o caminho vira o
    # backend do TelaHub.
    #
    # `API_UPSTREAM` precisa apontar para o backend acessível a partir DESTE
    # container. Se checkout e backend estiverem em stacks diferentes no
    # Portainer, eles precisam compartilhar uma rede Docker — senão o nome do
    # serviço não resolve. Ver README.
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A cadeia de X-Forwarded-For é o que permite ao backend enxergar o IP
        # do visitante. Sem isso, o rate limit do checkout agrupa todo mundo
        # num contador só (ver TRUST_PROXY no backend).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `Origin` é preservado de propósito: o backend valida a origem por
        # igualdade em CORS_ORIGINS, e o domínio do checkout precisa estar lá.
        proxy_set_header Origin $http_origin;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: as rotas /c/:token e /admin/* são resolvidas no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
