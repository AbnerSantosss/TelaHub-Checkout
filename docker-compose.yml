# Stack de PRODUÇÃO do checkout (contratação + painel do funil).
#
# A porta publicada é exigida pelo túnel, que roda no HOST e aponta para
# `localhost:42939`. A imagem vem pronta do GHCR.
#
# O Nginx desta imagem faz `proxy_pass http://backend:3001` em `/api/`, então
# este container PRECISA estar na mesma rede do backend do painel: é daí que ele
# lê plano, sessão de checkout e organização (ADR-001: backend único, dono do
# domínio).

services:
  checkout:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/abnersantosss/telahub-checkout:${IMAGE_TAG:-latest}
    container_name: telahub-checkout
    restart: unless-stopped
    ports:
      # checkout.proxserverabner.site -> localhost:42939 (rota a criar no túnel)
      - "42939:80"
    networks:
      - telahub_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Antes isto era `app-projeto_display_network` — nome DERIVADO do nome da
  # stack do painel, que quebrava o checkout se a stack fosse renomeada. Agora é
  # uma rede criada explicitamente:  docker network create telahub_net
  telahub_net:
    external: true
